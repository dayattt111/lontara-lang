<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dokumentasi Resmi Lontara-Lang</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Dokumentasi Resmi Lontara-Lang - Bahasa Pemrograman Edukatif Berbasis Bahasa Bugis & Aksara Lontara">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme Docsify Dark -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <style>
    :root {
      --theme-color: #f59e0b;
      --gold-primary: #d97706;
      --gold-accent: #f59e0b;
      --gold-light: #fbbf24;
      --bg-dark: #09090b;
      --panel-bg: #141417;
      --panel-header: #1c1c21;
      --border-color: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
    }

    * {
      border-radius: 0 !important; /* Sharp IDE aesthetic */
    }

    body {
      background-color: var(--bg-dark) !important;
      color: var(--text-main) !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Sidebar Styling */
    .sidebar {
      background-color: var(--panel-bg) !important;
      border-right: 1px solid var(--border-color) !important;
      color: var(--text-muted) !important;
    }

    .sidebar-nav li a {
      color: var(--text-muted) !important;
      font-size: 0.9rem;
      transition: color 0.15s ease;
    }

    .sidebar-nav li a:hover, 
    .sidebar-nav li.active > a {
      color: var(--gold-accent) !important;
      font-weight: 600;
      border-right: 2px solid var(--gold-accent);
    }

    .sidebar-nav strong {
      color: var(--gold-light) !important;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .app-name-link {
      color: var(--gold-accent) !important;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    /* Search Input */
    .search input {
      background-color: var(--bg-dark) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
    }

    .search input:focus {
      border-color: var(--gold-accent) !important;
    }

    /* Markdown Section Content */
    .markdown-section h1, 
    .markdown-section h2, 
    .markdown-section h3, 
    .markdown-section h4 {
      color: var(--gold-light);
      font-weight: 700;
    }

    .markdown-section a {
      color: var(--gold-accent);
      text-decoration: underline;
    }

    .markdown-section a:hover {
      color: var(--gold-light);
    }

    .markdown-section code {
      background-color: #1a1a20 !important;
      color: #34d399 !important;
      font-family: 'Fira Code', Consolas, monospace;
      padding: 2px 6px;
    }

    .markdown-section pre {
      background-color: #030304 !important;
      border: 1px solid var(--border-color);
      padding: 1rem;
    }

    .markdown-section pre > code {
      background-color: transparent !important;
      color: #e4e4e7 !important;
      padding: 0;
    }

    /* Tables */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
    }

    .markdown-section table th {
      background-color: var(--panel-header) !important;
      color: var(--gold-light) !important;
      border: 1px solid var(--border-color) !important;
      padding: 0.6rem 0.8rem;
    }

    .markdown-section table td {
      border: 1px solid var(--border-color) !important;
      padding: 0.5rem 0.8rem;
    }

    .markdown-section table tr:nth-child(2n) {
      background-color: #0e0e11;
    }

    /* Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid var(--gold-accent);
      background-color: rgba(217, 119, 6, 0.08);
      color: #d4d4d8;
      padding: 0.75rem 1rem;
    }

    /* Navbar styling */
    .app-nav {
      margin: 1rem 1.5rem;
    }

    .app-nav a {
      color: var(--gold-accent) !important;
      border: 1px solid var(--gold-primary);
      background: rgba(217, 119, 6, 0.15);
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none !important;
      transition: all 0.15s ease;
    }

    /* ============================================================
       ANDROID-STYLE FLOATING BOTTOM PILL & DRAWER (MOBILE)
       ============================================================ */
    .mobile-nav-pill {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      background-color: #141417;
      border: 2px solid var(--gold-accent);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 2px 2px 0px #000000;
      padding: 6px 20px 8px 20px;
      z-index: 1002;
      cursor: pointer;
      user-select: none;
      transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1), 
                  background-color 0.2s ease, 
                  border-color 0.2s ease,
                  box-shadow 0.2s ease;
      touch-action: manipulation;
    }

    .pill-indicator {
      width: 28px;
      height: 3px;
      background-color: var(--gold-accent);
      margin: 0 auto 5px auto;
      border-radius: 2px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .pill-body {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .pill-icon {
      color: var(--gold-accent);
      font-size: 1.1rem;
      line-height: 1;
      display: inline-block;
      transition: transform 0.25s ease;
    }

    /* State 1: Docked (Setengah masuk ke bawah layar saat scroll) */
    .mobile-nav-pill.docked {
      transform: translateX(-50%) translateY(55%);
      background-color: rgba(20, 20, 23, 0.95);
      border-color: rgba(245, 158, 11, 0.8);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .mobile-nav-pill.docked .pill-indicator {
      transform: translateY(-2px) scaleX(1.3);
      background-color: var(--gold-light);
    }

    /* State 2: Smooth popup animation when clicked from docked */
    .mobile-nav-pill.popping {
      animation: smoothPopup 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes smoothPopup {
      0% {
        transform: translateX(-50%) translateY(55%) scale(0.95);
      }
      60% {
        transform: translateX(-50%) translateY(-6px) scale(1.08);
      }
      100% {
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    /* State 3: Active when sidebar is open */
    .mobile-nav-pill.active {
      background-color: var(--panel-header);
      border-color: #fb7185;
      transform: translateX(-50%) translateY(0);
    }

    .mobile-nav-pill.active .pill-icon {
      color: #fb7185;
    }

    .mobile-nav-pill.active .pill-indicator {
      background-color: #fb7185;
    }

    /* Mobile-first Responsive Breakpoints */
    @media (max-width: 768px) {
      .mobile-nav-pill {
        display: block;
      }

      /* Sembunyikan default toggle bawaan Docsify */
      .sidebar-toggle {
        display: none !important;
      }
      
      .sidebar-backdrop {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: rgba(0, 0, 0, 0.65) !important;
        z-index: 800 !important; /* Di bawah sidebar */
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.25s ease !important;
      }

      body.sidebar-open .sidebar-backdrop,
      body.close .sidebar-backdrop {
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      /* Sidebar di Mobile */
      .sidebar {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        bottom: 0 !important;
        height: 100vh !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
        visibility: visible !important;
        display: block !important;
        transform: translateX(-105%) !important;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        z-index: 9999 !important; /* Di atas backdrop, tidak akan tertutup */
        width: 82% !important;
        max-width: 320px !important;
        background-color: #141417 !important;
        border-right: 2px solid var(--gold-accent) !important;
        box-shadow: none !important;
      }

      body.sidebar-open .sidebar,
      body.close .sidebar {
        transform: translateX(0) !important;
        box-shadow: 10px 0px 30px rgba(0, 0, 0, 0.8) !important;
      }

      .sidebar-nav {
        padding-bottom: 90px !important;
      }

      .sidebar-nav a {
        display: block !important;
        padding: 9px 12px !important;
        font-size: 0.95rem !important;
        color: #e4e4e7 !important;
        touch-action: manipulation !important;
      }

      .sidebar-nav a:hover,
      .sidebar-nav li.active > a {
        color: var(--gold-accent) !important;
        background-color: rgba(245, 158, 11, 0.12) !important;
      }

      .content {
        padding-top: 20px !important;
        padding-bottom: 80px !important; /* Space for bottom pill */
      }
      
      .markdown-section {
        padding: 1.5rem 1rem 5rem 1rem !important;
        max-width: 100% !important;
      }

      .app-nav {
        position: static !important;
        margin: 0.75rem 1rem !important;
        text-align: right;
      }

      .app-nav a {
        display: inline-block;
        margin-left: 0.35rem;
        margin-top: 0.25rem;
      }

      .markdown-section table {
        display: block !important;
        width: 100% !important;
        overflow-x: auto !important;
      }

      .markdown-section pre {
        overflow-x: auto !important;
        font-size: 0.85rem !important;
      }
    }

    .app-name img {
      max-height: 48px;
      margin: 0 auto 0.5rem auto;
      display: block;
    }

    .app-nav a:hover {
      background: var(--gold-accent);
      color: #000000 !important;
    }
  </style>
</head>
<body>
  <div id="app">Memuat dokumentasi Lontara-Lang...</div>

  <!-- Android-Style Floating Bottom Pill & Backdrop for Mobile -->
  <div id="mobile-nav-pill" class="mobile-nav-pill" aria-label="Menu Dokumentasi" onclick="handleMobilePillClick(event)">
    <div class="pill-indicator"></div>
    <div class="pill-body">
      <span id="pill-icon" class="pill-icon">☰</span>
      <span id="pill-text" class="pill-text">MENU</span>
    </div>
  </div>
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeSidebarMobile()"></div>

  <script>
    window.$docsify = {
      name: 'Lontara-Lang',
      logo: 'assets/lontara.svg',
      repo: 'https://github.com/dayattt111/lontara-lang',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      search: {
        placeholder: 'Cari panduan / kata kunci...',
        noData: 'Tidak ditemukan hasil yang cocok.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Salin',
        errorText: 'Gagal',
        successText: 'Tersalin'
      }
    };
  </script>
  <!-- Docsify v4 Core & Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>

  <!-- Android Bottom Pill Interaction Controller -->
  <script>
    let isSidebarOpen = false;
    const mobilePill = document.getElementById("mobile-nav-pill");
    const pillIcon = document.getElementById("pill-icon");
    const pillText = document.getElementById("pill-text");

    function openSidebarMobile() {
      isSidebarOpen = true;
      document.body.classList.add("sidebar-open", "close");
      mobilePill.classList.remove("docked", "popping");
      mobilePill.classList.add("active");
      pillIcon.textContent = "✕";
      pillText.textContent = "TUTUP";
    }

    function closeSidebarMobile() {
      isSidebarOpen = false;
      document.body.classList.remove("sidebar-open", "close");
      mobilePill.classList.remove("active");
      pillIcon.textContent = "☰";
      pillText.textContent = "MENU";
    }

    function handleMobilePillClick(e) {
      if (e) e.stopPropagation();

      // 1. Jika sidebar sedang terbuka: klik akan menutupnya
      if (isSidebarOpen) {
        closeSidebarMobile();
        return;
      }

      // 2. Jika tombol sedang setengah masuk (docked) saat scroll:
      if (mobilePill.classList.contains("docked")) {
        // Efek popup smooth iconnya kembali ke posisi normal
        mobilePill.classList.remove("docked");
        mobilePill.classList.add("popping");
        setTimeout(() => {
          mobilePill.classList.remove("popping");
        }, 400);
        return; // Klik pertama: memunculkan kembali tombol secara smooth
      }

      // 3. Jika tombol sudah di posisi normal (sudah popup): klik berikutnya membuka sidebar
      openSidebarMobile();
    }

    // Deteksi Scroll: Setengah masuk ke bawah layar saat scroll turun
    let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;

    window.addEventListener("scroll", () => {
      if (isSidebarOpen) return;

      const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;

      // Scroll ke bawah lebih dari 50px: setengah masuk ke fixed bottom
      if (currentScrollY > 60 && currentScrollY > lastScrollY) {
        mobilePill.classList.add("docked");
        mobilePill.classList.remove("popping");
      } else if (currentScrollY < lastScrollY - 15 || currentScrollY <= 25) {
        // Scroll ke atas: naik kembali ke posisi normal
        mobilePill.classList.remove("docked");
      }

      lastScrollY = currentScrollY;
    }, { passive: true });

    // Tutup sidebar otomatis saat link di sidebar diklik di layar HP
    document.addEventListener("click", (e) => {
      if (isSidebarOpen && e.target.closest(".sidebar-nav a")) {
        closeSidebarMobile();
      }
    });
  </script>
</body>
</html>
