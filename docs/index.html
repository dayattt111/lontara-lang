<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dokumentasi Resmi Lontara-Lang</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Dokumentasi Resmi Lontara-Lang - Bahasa Pemrograman Edukatif Berbasis Bahasa Bugis & Aksara Lontara">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme Docsify Dark -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <style>
    :root {
      --theme-color: #f59e0b;
      --gold-primary: #d97706;
      --gold-accent: #f59e0b;
      --gold-light: #fbbf24;
      --bg-dark: #09090b;
      --panel-bg: #141417;
      --panel-header: #1c1c21;
      --border-color: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
    }

    * {
      border-radius: 0 !important; /* Sharp IDE aesthetic */
    }

    body {
      background-color: var(--bg-dark) !important;
      color: var(--text-main) !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Sidebar Base Styling */
    .sidebar {
      background-color: var(--panel-bg) !important;
      border-right: 2px solid var(--border-color) !important;
      color: var(--text-muted) !important;
    }

    .sidebar-nav li a {
      color: #d4d4d8 !important;
      font-size: 0.9rem;
      transition: all 0.15s ease;
      padding: 6px 12px !important;
    }

    .sidebar-nav li a:hover, 
    .sidebar-nav li.active > a {
      color: var(--gold-accent) !important;
      font-weight: 600;
      background-color: rgba(245, 158, 11, 0.1) !important;
      border-right: 2px solid var(--gold-accent);
    }

    .sidebar-nav strong {
      color: var(--gold-light) !important;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .app-name-link {
      color: var(--gold-accent) !important;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    .app-name img {
      max-height: 48px;
      margin: 0 auto 0.5rem auto;
      display: block;
    }

    /* Search Input */
    .search input {
      background-color: var(--bg-dark) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color) !important;
    }

    .search input:focus {
      border-color: var(--gold-accent) !important;
    }

    /* Markdown Section Content */
    .markdown-section h1, 
    .markdown-section h2, 
    .markdown-section h3, 
    .markdown-section h4 {
      color: var(--gold-light);
      font-weight: 700;
    }

    .markdown-section a {
      color: var(--gold-accent);
      text-decoration: underline;
    }

    .markdown-section a:hover {
      color: var(--gold-light);
    }

    .markdown-section code {
      background-color: #1a1a20 !important;
      color: #34d399 !important;
      font-family: 'Fira Code', Consolas, monospace;
      padding: 2px 6px;
    }

    .markdown-section pre {
      background-color: #030304 !important;
      border: 1px solid var(--border-color);
      padding: 1rem;
    }

    .markdown-section pre > code {
      background-color: transparent !important;
      color: #e4e4e7 !important;
      padding: 0;
    }

    /* Tables */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
    }

    .markdown-section table th {
      background-color: var(--panel-header) !important;
      color: var(--gold-light) !important;
      border: 1px solid var(--border-color) !important;
      padding: 0.6rem 0.8rem;
    }

    .markdown-section table td {
      border: 1px solid var(--border-color) !important;
      padding: 0.5rem 0.8rem;
    }

    .markdown-section table tr:nth-child(2n) {
      background-color: #0e0e11;
    }

    /* Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid var(--gold-accent);
      background-color: rgba(217, 119, 6, 0.08);
      color: #d4d4d8;
      padding: 0.75rem 1rem;
    }

    /* Navbar styling */
    .app-nav {
      margin: 1rem 1.5rem;
    }

    .app-nav a {
      color: var(--gold-accent) !important;
      border: 1px solid var(--gold-primary);
      background: rgba(217, 119, 6, 0.15);
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none !important;
      transition: all 0.15s ease;
    }

    .app-nav a:hover {
      background: var(--gold-accent);
      color: #000000 !important;
    }

    /* ============================================================
       DESKTOP VIEW: Sidebar stays open, toggle hidden
       ============================================================ */
    @media (min-width: 769px) {
      .sidebar-toggle {
        display: none !important;
      }
    }

    /* ============================================================
       MOBILE VIEW: ANDROID FLOATING BOTTOM TOGGLE & DRAWER
       ============================================================ */
    @media (max-width: 768px) {
      /* Floating Pill Toggle Button */
      .sidebar-toggle {
        display: flex !important;
        position: fixed !important;
        bottom: 22px !important;
        left: 50% !important;
        top: auto !important;
        right: auto !important;
        transform: translateX(-50%) translateY(0) !important;
        width: auto !important;
        min-width: 120px !important;
        height: 44px !important;
        padding: 0 20px !important;
        background-color: #141417 !important;
        border: 2px solid var(--gold-accent) !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 2px 2px 0px #000000 !important;
        z-index: 10002 !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;
        cursor: pointer !important;
        user-select: none !important;
        touch-action: manipulation !important;
        transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1), 
                    background-color 0.2s ease, 
                    border-color 0.2s ease !important;
      }

      .sidebar-toggle span {
        background-color: var(--gold-accent) !important;
        height: 2.5px !important;
        width: 16px !important;
        margin: 2px 0 !important;
        display: block !important;
        transition: background-color 0.2s ease !important;
      }

      /* Text Label */
      .sidebar-toggle::after {
        content: "MENU";
        color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.5px;
        transition: color 0.2s ease;
      }

      /* When Sidebar is Open on Mobile */
      body.close .sidebar-toggle {
        border-color: #fb7185 !important;
        background-color: #1c1c21 !important;
      }

      body.close .sidebar-toggle span {
        background-color: #fb7185 !important;
      }

      body.close .sidebar-toggle::after {
        content: "TUTUP";
        color: #fb7185 !important;
      }

      /* State: Docked (Setengah masuk ke bawah layar saat scroll) */
      .sidebar-toggle.docked {
        transform: translateX(-50%) translateY(55%) !important;
        background-color: rgba(20, 20, 23, 0.95) !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5) !important;
      }

      /* State: Smooth Popup Animation */
      .sidebar-toggle.popping {
        animation: smoothPillPopup 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
      }

      @keyframes smoothPillPopup {
        0% { transform: translateX(-50%) translateY(55%) scale(0.95); }
        60% { transform: translateX(-50%) translateY(-6px) scale(1.06); }
        100% { transform: translateX(-50%) translateY(0) scale(1); }
      }

      /* Mobile Drawer Sidebar */
      .sidebar {
        left: -320px !important;
        width: 290px !important;
        max-width: 82vw !important;
        background-color: #141417 !important;
        border-right: 2px solid var(--gold-accent) !important;
        z-index: 10001 !important;
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
        box-shadow: none !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }

      body.close .sidebar {
        transform: translateX(320px) !important;
        box-shadow: 10px 0px 35px rgba(0, 0, 0, 0.85) !important;
      }

      /* Links in mobile sidebar are crystal clear and directly clickable */
      .sidebar-nav {
        padding-bottom: 90px !important;
      }

      .sidebar ul li a {
        color: #e4e4e7 !important;
        padding: 10px 14px !important;
        font-size: 15px !important;
        display: block !important;
        touch-action: manipulation !important;
      }

      .sidebar ul li a:hover,
      .sidebar ul li.active > a {
        color: var(--gold-accent) !important;
        background-color: rgba(245, 158, 11, 0.15) !important;
      }

      .content {
        padding-top: 20px !important;
        padding-bottom: 90px !important;
      }

      .markdown-section {
        padding: 1.5rem 1rem 5rem 1rem !important;
        max-width: 100% !important;
      }

      .app-nav {
        position: static !important;
        margin: 0.75rem 1rem !important;
        text-align: right;
      }

      .app-nav a {
        display: inline-block;
        margin-left: 0.35rem;
        margin-top: 0.25rem;
      }

      .markdown-section table {
        display: block !important;
        width: 100% !important;
        overflow-x: auto !important;
      }

      .markdown-section pre {
        overflow-x: auto !important;
        font-size: 0.85rem !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">Memuat dokumentasi Lontara-Lang...</div>

  <script>
    window.$docsify = {
      name: 'Lontara-Lang',
      logo: 'assets/lontara.svg',
      repo: 'https://github.com/dayattt111/lontara-lang',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      search: {
        placeholder: 'Cari panduan / kata kunci...',
        noData: 'Tidak ditemukan hasil yang cocok.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Salin',
        errorText: 'Gagal',
        successText: 'Tersalin'
      }
    };
  </script>
  <!-- Docsify v4 Core & Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>

  <!-- Android Bottom Pill Scroll & Popup Controller -->
  <script>
    let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;

    // Deteksi Scroll: Setengah masuk ke bawah layar saat scroll turun
    window.addEventListener("scroll", () => {
      const toggleBtn = document.querySelector(".sidebar-toggle");
      if (!toggleBtn) return;

      const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;

      // Scroll ke bawah lebih dari 50px: setengah masuk ke fixed bottom
      if (currentScrollY > 60 && currentScrollY > lastScrollY) {
        toggleBtn.classList.add("docked");
        toggleBtn.classList.remove("popping");
      } else if (currentScrollY < lastScrollY - 15 || currentScrollY <= 25) {
        // Scroll ke atas: naik kembali ke posisi normal
        toggleBtn.classList.remove("docked");
      }

      lastScrollY = currentScrollY;
    }, { passive: true });

    // Click handler pada .sidebar-toggle:
    // Jika tombol sedang docked (tenggelam): popup smooth terlebih dahulu
    // Jika sudah di posisi normal: biarkan Docsify membuka/menutup sidebar secara native!
    document.addEventListener("click", (e) => {
      const toggleBtn = e.target.closest(".sidebar-toggle");
      if (toggleBtn && toggleBtn.classList.contains("docked")) {
        e.preventDefault();
        e.stopPropagation();
        toggleBtn.classList.remove("docked");
        toggleBtn.classList.add("popping");
        setTimeout(() => {
          toggleBtn.classList.remove("popping");
        }, 350);
      }
    }, true); // Capture phase agar bisa mencegat klik saat docked
  </script>
</body>
</html>
