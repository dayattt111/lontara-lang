<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lontara-Lang Web Playground | Powered by Hikaruu</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-bg: #141417;
            --panel-header: #1c1c21;
            --gold-primary: #d97706;
            --gold-accent: #f59e0b;
            --gold-light: #fbbf24;
            --border-color: #27272a;
            --border-highlight: #b45309;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --term-bg: #030304;
            --term-green: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            border-radius: 0 !important; /* Sharp IDE aesthetic (Anti-round) */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            padding: 0.85rem 1.25rem;
            border-bottom: 2px solid var(--border-highlight);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gold-accent);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-sub {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 0.15rem;
        }

        .powered-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--gold-light);
            background: rgba(217, 119, 6, 0.15);
            border: 1px solid var(--gold-primary);
            padding: 0.35rem 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #status-indicator {
            font-size: 0.8rem;
            padding: 0.35rem 0.85rem;
            background-color: #78350f;
            color: var(--gold-light);
            border: 1px solid var(--gold-primary);
            font-weight: 600;
            font-family: monospace;
        }

        #status-indicator.ready {
            background-color: #064e3b;
            color: #6ee7b7;
            border-color: #059669;
        }

        /* Mobile-First Layout: Stacked by default */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
        }

        /* Desktop Layout Expansion */
        @media (min-width: 900px) {
            main {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1.25rem;
                padding: 1.25rem;
            }
        }

        .editor-container, .output-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            min-height: 380px;
        }

        .panel-header {
            background-color: var(--panel-header);
            padding: 0.6rem 0.85rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 0.75px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            width: 100%;
        }

        @media (min-width: 600px) {
            .controls {
                width: auto;
            }
        }

        select {
            flex: 1;
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.45rem 0.65rem;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--gold-primary);
        }

        button {
            background-color: var(--gold-primary);
            color: #000000;
            border: 1px solid var(--gold-accent);
            padding: 0.45rem 1rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s ease-in-out;
        }

        button:hover:not(:disabled) {
            background-color: var(--gold-accent);
            color: #000000;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        textarea {
            flex: 1;
            width: 100%;
            min-height: 320px;
            background: var(--bg-dark);
            color: #f4f4f5;
            border: none;
            padding: 1rem;
            font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        .output-box {
            flex: 1;
            min-height: 320px;
            background-color: var(--term-bg);
            color: var(--term-green);
            padding: 1rem;
            font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            border-top: 1px solid var(--border-color);
        }

        footer {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 0.75rem 1.25rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        footer a {
            color: var(--gold-accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div>
                <div class="brand-title">
                    <span>ᨒᨚᨈᨑ</span> Lontara-Lang Playground
                </div>
                <div class="brand-sub">Interpreter Berbasis Bahasa Bugis & Aksara Lontara</div>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <div class="powered-badge">POWERED BY HIKARUU</div>
            <div id="status-indicator">Memuat WASM Engine...</div>
        </div>
    </header>

    <main>
        <!-- Editor Panel -->
        <div class="editor-container">
            <div class="panel-header">
                <span class="panel-title">Editor Kode</span>
                <div class="controls">
                    <select id="sample-select" onchange="loadSample()">
                        <option value="loop_bugis">Perulangan siki (Bugis Latin)</option>
                        <option value="loop_lontara">Perulangan ᨔᨗᨀᨗ (Aksara Lontara)</option>
                        <option value="cond_bugis">Percabangan rekko & sangadinna (Latin)</option>
                        <option value="cond_lontara">Percabangan ᨑᨙᨀᨚ & ᨔᨂᨉᨗᨊ (Lontara)</option>
                        <option value="func_bugis">Fungsi jamagau & lisu (Latin)</option>
                        <option value="func_lontara">Fungsi ᨍᨆᨁᨕᨘ & ᨒᨗᨔᨘ (Lontara)</option>
                        <option value="builtin_bugis">Fungsi Bawaan (panjang, tipe, paui)</option>
                        <option value="builtin_lontara">Fungsi Bawaan (ᨄᨍ, ᨈᨗᨄᨙ, ᨄᨕᨘᨕᨗ)</option>
                    </select>
                    <button id="run-btn" onclick="runCode()" disabled>Jalankan Kode ▶</button>
                </div>
            </div>
            <textarea id="code-editor" spellcheck="false" placeholder="Tulis kode Lontara-Lang di sini..."></textarea>
        </div>

        <!-- Output Panel -->
        <div class="output-container">
            <div class="panel-header">
                <span class="panel-title">Konsol Luaran (Output)</span>
                <button style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color);" onclick="clearOutput()">Bersihkan</button>
            </div>
            <div id="output" class="output-box">Memuat engine WebAssembly Lontara-Lang...</div>
        </div>
    </main>

    <footer>
        <div>Lontara-Lang v0.2.0 • Lisensi MIT</div>
        <div>Engine WASM • <strong>Powered by Hikaruu</strong></div>
    </footer>

    <script src="wasm_exec.js"></script>
    <script>
        const samples = {
            loop_bugis: `// Perulangan siki (Bugis Latin)\ntaroi i = 1;\ntaroi total = 0;\n\nsiki (i <= 5) {\n    paui("Iterasi baris ke-", i);\n    taroi total = total + i;\n    taroi i = i + 1;\n}\n\npaui("Total akumulasi perulangan:", total);`,
            loop_lontara: `// Perulangan ᨔᨗᨀᨗ (Aksara Lontara Unicode)\nᨈᨑᨚᨕᨗ ᨕᨗ = 1;\nᨈᨑᨚᨕᨗ total = 0;\n\nᨔᨗᨀᨗ (ᨕᨗ <= 5) {\n    ᨄᨕᨘᨕᨗ("Iterasi ke-", ᨕᨗ);\n    ᨈᨑᨚᨕᨗ total = total + ᨕᨗ;\n    ᨈᨑᨚᨕᨗ ᨕᨗ = ᨕᨗ + 1;\n}\n\nᨄᨕᨘᨕᨗ("Hasil:", total);`,
            cond_bugis: `// Percabangan rekko & sangadinna\ntaroi angka = 15;\n\nrekko (angka >= 10) {\n    paui("Nilai angka sitinaja (>= 10):", angka);\n} sangadinna {\n    paui("Nilai angka kurang dari 10");\n}`,
            cond_lontara: `// Percabangan ᨑᨙᨀᨚ & ᨔᨂᨉᨗᨊ\nᨈᨑᨚᨕᨗ angka = 20;\n\nᨑᨙᨀᨚ (angka > 10) {\n    ᨄᨕᨘᨕᨗ("salama - angka battu (", angka, ")");\n} ᨔᨂᨉᨗᨊ {\n    ᨄᨕᨘᨕᨗ("angka caddi");\n}`,
            func_bugis: `// Fungsi jamagau & lisu (Latin)\ntaroi faktorial = jamagau(n) {\n    rekko (n <= 1) {\n        lisu 1;\n    }\n    lisu n * faktorial(n - 1);\n};\n\npaui("Faktorial dari 5:", faktorial(5));`,
            func_lontara: `// Fungsi ᨍᨆᨁᨕᨘ & ᨒᨗᨔᨘ (Lontara)\nᨈᨑᨚᨕᨗ tambah = ᨍᨆᨁᨕᨘ(x, y) {\n    ᨒᨗᨔᨘ x + y;\n};\n\nᨈᨑᨚᨕᨗ hasil = tambah(12, 8);\nᨄᨕᨘᨕᨗ("Hasil pencumlahan:", hasil);`,
            builtin_bugis: `// Fungsi Bawaan (panjang, tipe, paui)\ntaroi teks = "Salama Lontara-Lang";\npaui("Teks masukan:", teks);\npaui("Panjang teks:", panjang(teks));\npaui("Tipe data:", tipe(teks));`,
            builtin_lontara: `// Fungsi Bawaan Lontara (ᨄᨍ, ᨈᨗᨄᨙ, ᨄᨕᨘᨕᨗ)\nᨈᨑᨚᨕᨗ teks = "ᨒᨚᨈᨑ";\nᨄᨕᨘᨕᨗ("Teks:", teks);\nᨄᨕᨘᨕᨗ("Panjang:", ᨄᨍ(teks));\nᨄᨕᨘᨕᨗ("Tipe:", ᨈᨗᨄᨙ(teks));`
        };

        const editor = document.getElementById("code-editor");
        const output = document.getElementById("output");
        const statusInd = document.getElementById("status-indicator");
        const runBtn = document.getElementById("run-btn");

        editor.value = samples.loop_bugis;

        function loadSample() {
            const val = document.getElementById("sample-select").value;
            if (samples[val]) {
                editor.value = samples[val];
            }
        }

        function clearOutput() {
            output.textContent = "";
        }

        function runCode() {
            if (typeof evaluateLontara !== "function") {
                output.textContent = "Error: Engine WebAssembly belum siap.";
                return;
            }
            const code = editor.value;
            const res = evaluateLontara(code);
            output.textContent = res !== undefined ? res : "(Eksekusi selesai tanpa luaran)";
        }

        // Memuat biner WASM Go
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("lontara.wasm"), go.importObject)
            .then((result) => {
                go.run(result.instance);
                statusInd.textContent = "WASM Ready";
                statusInd.classList.add("ready");
                runBtn.disabled = false;
                output.textContent = "Modul WebAssembly berhasil dimuat. Klik 'Jalankan Kode ▶' untuk mengevaluasi.";
            })
            .catch((err) => {
                statusInd.textContent = "Gagal WASM";
                statusInd.style.backgroundColor = "#991b1b";
                statusInd.style.color = "#ffffff";
                output.textContent = "Gagal memuat file lontara.wasm: " + err;
            });
    </script>
</body>
</html>
