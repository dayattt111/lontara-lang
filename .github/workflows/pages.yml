name: Automasi Deploy GitHub Pages (Web Playground)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build WASM & Prepare Pages Site
        run: |
          mkdir -p _site
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" _site/
          GOOS=js GOARCH=wasm go build -o _site/lontara.wasm ./cmd/wasm
          cp examples/playground.html _site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
