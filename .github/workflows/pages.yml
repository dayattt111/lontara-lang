name: Automasi Deploy GitHub Pages (Web Playground)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build WASM & Prepare Pages Site
        run: |
          mkdir -p _site
          WASM_EXEC=$(find /opt/hostedtoolcache/go "$(go env GOROOT 2>/dev/null)" /usr/local/go -name "wasm_exec.js" 2>/dev/null | head -n 1)
          if [ -z "$WASM_EXEC" ]; then
            echo "Error: file wasm_exec.js tidak ditemukan!"
            exit 1
          fi
          echo "Disalin dari: $WASM_EXEC"
          cp "$WASM_EXEC" _site/
          GOOS=js GOARCH=wasm go build -o _site/lontara.wasm ./cmd/wasm
          cp examples/playground.html _site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
