name: Automasi Release Biner (GitHub Releases)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/lontara-linux-amd64 ./cmd/lontara
          GOOS=linux GOARCH=arm64 go build -o dist/lontara-linux-arm64 ./cmd/lontara
          GOOS=darwin GOARCH=amd64 go build -o dist/lontara-darwin-amd64 ./cmd/lontara
          GOOS=darwin GOARCH=arm64 go build -o dist/lontara-darwin-arm64 ./cmd/lontara
          GOOS=windows GOARCH=amd64 go build -o dist/lontara-windows-amd64.exe ./cmd/lontara
          GOOS=js GOARCH=wasm go build -o dist/lontara.wasm ./cmd/wasm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
